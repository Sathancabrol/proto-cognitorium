
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  .sb-root {
    background: #050508;
    color: #C8D0E0;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  .sb-header {
    background: #050508;
    border-bottom: 1px solid rgba(123,97,255,0.2);
    padding: 20px 32px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sb-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .sb-logo-icon {
    width: 28px;
    height: 28px;
  }

  .sb-logo-text {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.04em;
  }

  .sb-meta {
    font-size: 11px;
    color: #4A5568;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
  }

  .sb-nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .sb-nav-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #1A1A2E;
    border: 1px solid #2D2D45;
    cursor: pointer;
    transition: all 0.2s;
  }

  .sb-nav-dot.active {
    background: #7B61FF;
    border-color: #7B61FF;
  }

  .sb-scroll {
    overflow-x: auto;
    overflow-y: visible;
    padding: 32px 32px 48px;
    scrollbar-width: thin;
    scrollbar-color: #1A1A2E #050508;
  }

  .sb-scroll::-webkit-scrollbar { height: 4px; }
  .sb-scroll::-webkit-scrollbar-track { background: #050508; }
  .sb-scroll::-webkit-scrollbar-thumb { background: #1A1A2E; border-radius: 2px; }

  .sb-track {
    display: flex;
    gap: 0;
    align-items: flex-start;
    min-width: max-content;
    position: relative;
  }

  .sb-connector {
    width: 32px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 260px;
    margin-top: 56px;
  }

  .sb-connector-line {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, rgba(123,97,255,0.3) 0%, rgba(0,255,136,0.3) 100%);
    position: relative;
  }

  .sb-connector-arrow {
    position: absolute;
    right: -4px;
    top: -4px;
    width: 8px;
    height: 8px;
    border-top: 1px solid rgba(123,97,255,0.5);
    border-right: 1px solid rgba(123,97,255,0.5);
    transform: rotate(45deg);
  }

  .sb-card {
    width: 220px;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .sb-card:hover {
    transform: translateY(-4px);
  }

  .sb-card:hover .sb-screen {
    border-color: rgba(123,97,255,0.5);
    box-shadow: 0 0 24px rgba(123,97,255,0.12), 0 8px 32px rgba(0,0,0,0.4);
  }

  .sb-card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #7B61FF;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sb-card-num::before {
    content: '';
    display: block;
    width: 16px;
    height: 1px;
    background: #7B61FF;
    opacity: 0.5;
  }

  .sb-screen {
    background: #0A0A12;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    height: 260px;
    overflow: hidden;
    position: relative;
    transition: border-color 0.25s, box-shadow 0.25s;
  }

  .sb-card-info {
    padding: 12px 0 0;
  }

  .sb-card-title {
    font-size: 12px;
    font-weight: 600;
    color: #E2E8F0;
    margin-bottom: 5px;
    letter-spacing: 0.01em;
  }

  .sb-card-desc {
    font-size: 10.5px;
    color: #4A5568;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .sb-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .sb-tag {
    font-size: 9.5px;
    padding: 2px 7px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.04em;
  }

  .sb-tag-anim { background: rgba(123,97,255,0.12); color: #9B8BFF; border: 1px solid rgba(123,97,255,0.2); }
  .sb-tag-interact { background: rgba(0,255,136,0.08); color: #00C870; border: 1px solid rgba(0,255,136,0.15); }
  .sb-tag-trans { background: rgba(255,200,80,0.08); color: #CCA84A; border: 1px solid rgba(255,200,80,0.15); }

  /* Screen inners */
  .sc { width: 100%; height: 100%; position: relative; overflow: hidden; }

  /* Pulse animation */
  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 1; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  @keyframes float-up {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes shimmer {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }
  @keyframes draw-line {
    from { stroke-dashoffset: 100; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes blink-cursor {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes node-appear {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @keyframes glow-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(123,97,255,0.3); }
    50% { box-shadow: 0 0 20px rgba(123,97,255,0.7); }
  }
  @keyframes scan-line {
    0% { transform: translateY(-100%); }
    100% { transform: translateY(400%); }
  }
</style>

const track = document.getElementById('sbTrack');
const navDots = document.getElementById('navDots');

screens.forEach((sc, i) => {
  // Nav dot
  const dot = document.createElement('div');
  dot.className = 'sb-nav-dot' + (i === 0 ? ' active' : '');
  dot.title = `Écran ${sc.num}`;
  dot.onclick = () => {
    const cards = document.querySelectorAll('.sb-card');
    cards[i].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    document.querySelectorAll('.sb-nav-dot').forEach((d, j) => d.classList.toggle('active', j === i));
  };
  navDots.appendChild(dot);

  // Connector (not before first)
  if (i > 0) {
    const conn = document.createElement('div');
    conn.className = 'sb-connector';
    conn.innerHTML = `<div class="sb-connector-line"><div class="sb-connector-arrow"></div></div>`;
    track.appendChild(conn);
  }

  // Card
  const card = document.createElement('div');
  card.className = 'sb-card';
  
  const screenEl = document.createElement('div');
  screenEl.className = 'sb-screen';
  sc.render(screenEl);

  const tagsHTML = sc.tags.map(([type, label]) => 
    `<span class="sb-tag sb-tag-${type === 'anim' ? 'anim' : type === 'interact' ? 'interact' : 'trans'}">${label}</span>`
  ).join('');

  card.innerHTML = `
    <div class="sb-card-num">${sc.num}</div>
  `;
  card.appendChild(screenEl);
  
  const info = document.createElement('div');
  info.className = 'sb-card-info';
  info.innerHTML = `
    <div class="sb-card-title">${sc.title}</div>
    <div class="sb-card-desc">${sc.desc}</div>
    <div class="sb-tags">${tagsHTML}</div>
  `;
  card.appendChild(info);
  
  track.appendChild(card);
});

// Update active dot on scroll
const scroll = document.getElementById('sbScroll');
scroll.addEventListener('scroll', () => {
  const cards = document.querySelectorAll('.sb-card');
  const scrollLeft = scroll.scrollLeft;
  const containerWidth = scroll.clientWidth;
  const center = scrollLeft + containerWidth / 2;
  
  let activeIdx = 0;
  let minDist = Infinity;
  cards.forEach((c, i) => {
    const rect = c.getBoundingClientRect();
    const cardCenter = rect.left + rect.width / 2;
    const dist = Math.abs(cardCenter - containerWidth / 2);
    if (dist < minDist) { minDist = dist; activeIdx = i; }
  });
  
  document.querySelectorAll('.sb-nav-dot').forEach((d, j) => d.classList.toggle('active', j === activeIdx));
});
