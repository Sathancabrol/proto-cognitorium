
<style>
* { box-sizing: border-box; }
#cog-wrap { display: flex; height: 520px; background: var(--surface-1); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border); position: relative; }
#cog-svg { flex: 1; cursor: grab; }
#cog-svg:active { cursor: grabbing; }
#cog-panel { width: 220px; border-left: 0.5px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); overflow-y: auto; }
.panel-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin: 0; }
.panel-sub { font-size: 12px; color: var(--text-muted); margin: 0; line-height: 1.5; }
.conn-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.conn-item { font-size: 12px; padding: 4px 8px; background: var(--surface-1); border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--text-secondary); cursor: pointer; }
.conn-item:hover { border-color: var(--border-accent); color: var(--text-accent); }
.section-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.add-row { display: flex; gap: 6px; }
.add-row input { flex: 1; min-width: 0; font-size: 12px; padding: 4px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-primary); }
.add-row input:focus { outline: none; border-color: var(--border-accent); }
.add-row button { font-size: 11px; padding: 4px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
.add-row button:hover { background: var(--surface-0); color: var(--text-primary); }
.search-row { display: flex; gap: 6px; }
.search-row input { flex: 1; font-size: 12px; padding: 4px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-primary); }
.search-row input:focus { outline: none; border-color: var(--border-accent); }
.badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 99px; font-weight: 500; }
.badge-blue { background: var(--bg-accent); color: var(--text-accent); }
.badge-green { background: var(--bg-success); color: var(--text-success); }
.empty-state { font-size: 12px; color: var(--text-muted); font-style: italic; }
#delete-btn { font-size: 11px; padding: 4px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-danger); background: transparent; color: var(--text-danger); cursor: pointer; margin-top: 4px; }
#delete-btn:hover { background: var(--bg-danger); }
</style>

<h2 class="sr-only">Cognitarium — interactive knowledge graph showing cognitive skill connections</h2>

<div id="cog-wrap">
  <svg id="cog-svg"></svg>
  <div id="cog-panel">
    <div>
      <p class="section-label">Search</p>
      <div class="search-row"><input id="search-input" placeholder="Find a skill…" oninput="searchNode(this.value)"></div>
    </div>
    <div id="node-section">
      <p class="section-label">Selected node</p>
      <p class="panel-title" id="pTitle" style="color:var(--text-muted);font-style:italic">None selected</p>
      <p class="panel-sub" id="pDesc"></p>
      <div id="pBadges" style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px"></div>
      <button id="delete-btn" style="display:none" onclick="deleteSelected()">Remove node</button>
    </div>
    <div>
      <p class="section-label">Connections</p>
      <ul class="conn-list" id="pConns"><li class="empty-state">Click a node to explore</li></ul>
    </div>
    <div style="flex:1"></div>
    <div>
      <p class="section-label" style="margin-bottom:6px">Add node</p>
      <div class="add-row"><input id="new-node-input" placeholder="Skill name…"><button onclick="addNode()">Add</button></div>
    </div>
    <div>
      <p class="section-label" style="margin-bottom:6px">Add link</p>
      <div class="add-row"><input id="link-a" placeholder="From…"></div>
      <div class="add-row" style="margin-top:4px"><input id="link-b" placeholder="To…"><button onclick="addLink()">Link</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const nodeInfo = {
  python:   { desc: "General-purpose programming language, core tool for data work.", tags:["technical","tool"] },
  sql:      { desc: "Structured query language for relational databases.", tags:["technical","data"] },
  stats:    { desc: "Statistical reasoning, probability, and inference.", tags:["analytical","math"] },
  ml:       { desc: "Machine learning — models, training, evaluation.", tags:["technical","analytical"] },
  analysis: { desc: "Data analysis: transforming raw data into insight.", tags:["core","analytical"] },
  math:     { desc: "Foundational quantitative and logical thinking.", tags:["foundational"] },
  dataviz:  { desc: "Visual communication of data and patterns.", tags:["creative","communication"] },
  comm:     { desc: "Clear communication of complex ideas.", tags:["soft-skill"] },
  pm:       { desc: "Project management and coordination.", tags:["soft-skill","leadership"] },
  logic:    { desc: "Formal reasoning, deduction, and problem structuring.", tags:["foundational"] },
};

let nodes = [
  {id:"python"},{id:"sql"},{id:"stats"},{id:"ml"},
  {id:"analysis"},{id:"math"},{id:"dataviz"},
  {id:"comm"},{id:"pm"},{id:"logic"}
];
let links = [
  {source:"python",target:"analysis"},
  {source:"sql",target:"analysis"},
  {source:"stats",target:"analysis"},
  {source:"analysis",target:"ml"},
  {source:"math",target:"ml"},
  {source:"dataviz",target:"analysis"},
  {source:"logic",target:"math"},
  {source:"comm",target:"pm"},
  {source:"pm",target:"analysis"}
];

const svgEl = document.getElementById("cog-svg");
const W = () => svgEl.clientWidth;
const H = () => svgEl.clientHeight;

let selectedId = null;

const svg = d3.select("#cog-svg");
const g = svg.append("g");

svg.call(d3.zoom().scaleExtent([0.3,3]).on("zoom", e => g.attr("transform", e.transform)));

let linkSel, nodeSel, sim;

const colorMap = {
  technical: "#378ADD",
  analytical: "#1D9E75",
  foundational: "#7F77DD",
  math: "#7F77DD",
  data: "#378ADD",
  tool: "#378ADD",
  core: "#EF9F27",
  communication: "#D85A30",
  "soft-skill": "#D4537E",
  creative: "#D85A30",
  leadership: "#D4537E",
  default: "#888780"
};

function nodeColor(id) {
  const info = nodeInfo[id];
  if (!info || !info.tags) return colorMap.default;
  for (const t of info.tags) if (colorMap[t]) return colorMap[t];
  return colorMap.default;
}

function build() {
  g.selectAll("*").remove();

  g.append("defs").append("marker")
    .attr("id","arr").attr("viewBox","0 0 10 10")
    .attr("refX",8).attr("refY",5)
    .attr("markerWidth",6).attr("markerHeight",6)
    .attr("orient","auto-start-reverse")
    .append("path").attr("d","M2 1L8 5L2 9")
    .attr("fill","none").attr("stroke","var(--border-stronger)")
    .attr("stroke-width","1.5").attr("stroke-linecap","round").attr("stroke-linejoin","round");

  const ldata = links.map(l => ({
    source: typeof l.source === "object" ? l.source.id : l.source,
    target: typeof l.target === "object" ? l.target.id : l.target
  }));

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(ldata).id(d=>d.id).distance(100))
    .force("charge", d3.forceManyBody().strength(-280))
    .force("center", d3.forceCenter(W()/2, H()/2))
    .force("collide", d3.forceCollide(30));

  linkSel = g.selectAll(".lnk").data(ldata).enter()
    .append("line").attr("class","lnk")
    .attr("stroke","var(--border-strong)").attr("stroke-width",1);

  nodeSel = g.selectAll(".nd").data(nodes).enter()
    .append("g").attr("class","nd")
    .style("cursor","pointer")
    .call(d3.drag()
      .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
      .on("drag",(e,d)=>{ d.fx=e.x; d.fy=e.y; })
      .on("end",(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
    )
    .on("click",(e,d)=>{ e.stopPropagation(); selectNode(d.id); });

  nodeSel.append("circle")
    .attr("r",22)
    .attr("fill", d => nodeColor(d.id))
    .attr("fill-opacity", 0.18)
    .attr("stroke", d => nodeColor(d.id))
    .attr("stroke-width", 1.5);

  nodeSel.append("text")
    .attr("text-anchor","middle").attr("dominant-baseline","central")
    .attr("font-size","11").attr("font-weight","500")
    .attr("fill", d => nodeColor(d.id))
    .text(d => d.id);

  svg.on("click", () => clearSelection());

  sim.on("tick", () => {
    linkSel
      .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
}

function selectNode(id) {
  selectedId = id;
  const info = nodeInfo[id] || {};
  document.getElementById("pTitle").textContent = id;
  document.getElementById("pTitle").style.color = nodeColor(id);
  document.getElementById("pTitle").style.fontStyle = "normal";
  document.getElementById("pDesc").textContent = info.desc || "A skill node in the graph.";
  const badges = document.getElementById("pBadges");
  badges.innerHTML = "";
  (info.tags||[]).forEach(t => {
    const b = document.createElement("span");
    b.className = "badge badge-blue";
    b.textContent = t;
    badges.appendChild(b);
  });
  document.getElementById("delete-btn").style.display = "block";

  const connected = links.filter(l => {
    const s = typeof l.source==="object" ? l.source.id : l.source;
    const t = typeof l.target==="object" ? l.target.id : l.target;
    return s===id || t===id;
  });
  const list = document.getElementById("pConns");
  list.innerHTML = "";
  if (!connected.length) {
    list.innerHTML = '<li class="empty-state">No connections yet</li>';
  } else {
    connected.forEach(l => {
      const s = typeof l.source==="object" ? l.source.id : l.source;
      const t = typeof l.target==="object" ? l.target.id : l.target;
      const other = s===id ? t : s;
      const li = document.createElement("li");
      li.className = "conn-item";
      li.textContent = other;
      li.onclick = () => selectNode(other);
      list.appendChild(li);
    });
  }

  // highlight
  nodeSel.select("circle")
    .attr("fill-opacity", d => d.id===id ? 0.35 : 0.18)
    .attr("stroke-width", d => d.id===id ? 2.5 : 1.5);
  linkSel
    .attr("stroke", l => {
      const s = typeof l.source==="object" ? l.source.id : l.source;
      const t = typeof l.target==="object" ? l.target.id : l.target;
      return (s===id||t===id) ? nodeColor(id) : "var(--border-strong)";
    })
    .attr("stroke-width", l => {
      const s = typeof l.source==="object" ? l.source.id : l.source;
      const t = typeof l.target==="object" ? l.target.id : l.target;
      return (s===id||t===id) ? 2 : 1;
    })
    .attr("stroke-opacity", l => {
      const s = typeof l.source==="object" ? l.source.id : l.source;
      const t = typeof l.target==="object" ? l.target.id : l.target;
      return (s===id||t===id) ? 1 : 0.4;
    });
}

function clearSelection() {
  selectedId = null;
  document.getElementById("pTitle").textContent = "None selected";
  document.getElementById("pTitle").style.color = "var(--text-muted)";
  document.getElementById("pTitle").style.fontStyle = "italic";
  document.getElementById("pDesc").textContent = "";
  document.getElementById("pBadges").innerHTML = "";
  document.getElementById("pConns").innerHTML = '<li class="empty-state">Click a node to explore</li>';
  document.getElementById("delete-btn").style.display = "none";
  if (nodeSel) nodeSel.select("circle").attr("fill-opacity",0.18).attr("stroke-width",1.5);
  if (linkSel) linkSel.attr("stroke","var(--border-strong)").attr("stroke-width",1).attr("stroke-opacity",1);
}

function searchNode(q) {
  if (!q || !nodeSel) { if(nodeSel) nodeSel.select("circle").attr("fill-opacity",0.18); return; }
  nodeSel.select("circle").attr("fill-opacity", d => d.id.includes(q.toLowerCase()) ? 0.45 : 0.08);
}

function addNode() {
  const inp = document.getElementById("new-node-input");
  const id = inp.value.trim().toLowerCase().replace(/\s+/g,"-");
  if (!id || nodes.find(n=>n.id===id)) { inp.value=""; return; }
  nodes.push({id});
  inp.value = "";
  build();
}

function addLink() {
  const a = document.getElementById("link-a").value.trim().toLowerCase().replace(/\s+/g,"-");
  const b = document.getElementById("link-b").value.trim().toLowerCase().replace(/\s+/g,"-");
  if (!a||!b||a===b) return;
  if (!nodes.find(n=>n.id===a) || !nodes.find(n=>n.id===b)) return;
  links.push({source:a,target:b});
  document.getElementById("link-a").value="";
  document.getElementById("link-b").value="";
  build();
  if (selectedId) setTimeout(()=>selectNode(selectedId),50);
}

function deleteSelected() {
  if (!selectedId) return;
  nodes = nodes.filter(n=>n.id!==selectedId);
  links = links.filter(l=>{
    const s = typeof l.source==="object"?l.source.id:l.source;
    const t = typeof l.target==="object"?l.target.id:l.target;
    return s!==selectedId && t!==selectedId;
  });
  clearSelection();
  build();
}

build();
</script>
