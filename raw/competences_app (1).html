<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaîne de Valeur des Compétences</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --metier: #58a6ff;
    --mission: #3fb950;
    --tache: #d29922;
    --competence: #f78166;
    --capacite: #bc8cff;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* TOP BAR */
  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 20px; background: var(--bg2); border-bottom: 1px solid var(--border);
    flex-shrink: 0; z-index: 100;
  }
  #topbar h1 { font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .5px; white-space: nowrap; }
  .nav-tabs { display: flex; gap: 4px; margin-left: 8px; }
  .nav-tab {
    padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
    background: transparent; border: 1px solid transparent; color: var(--text2); transition: all .15s;
  }
  .nav-tab:hover { background: var(--bg3); color: var(--text); }
  .nav-tab.active { background: var(--bg3); border-color: var(--border); color: var(--text); }
  #profile-btn {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text); transition: all .15s;
  }
  #profile-btn:hover { border-color: var(--accent); }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--bg); }

  /* MAIN */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: 260px; min-width: 260px; background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; transition: width .2s;
  }
  #sidebar.collapsed { width: 0; min-width: 0; }
  #sidebar-inner { width: 260px; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .sidebar-section { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-section h3 { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }
  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; cursor: pointer; }
  .filter-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .filter-label { font-size: 13px; }
  .filter-row input[type=checkbox] { margin-left: auto; accent-color: var(--accent); width: 14px; height: 14px; }
  #tree-panel { flex: 1; overflow-y: auto; padding: 8px 0; }
  .tree-metier { padding: 8px 16px; font-size: 13px; font-weight: 600; color: var(--metier); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .tree-metier:hover { background: var(--bg3); }
  .tree-mission { padding: 6px 16px 6px 28px; font-size: 12px; color: var(--mission); cursor: pointer; }
  .tree-mission:hover { background: var(--bg3); }
  .tree-tache { padding: 4px 16px 4px 42px; font-size: 12px; color: var(--text2); cursor: pointer; }
  .tree-tache:hover { background: var(--bg3); color: var(--text); }
  .chevron { font-size: 10px; transition: transform .15s; }
  .chevron.open { transform: rotate(90deg); }

  /* CONTENT */
  #content { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }

  /* GRAPH VIEW */
  #graph-view { flex: 1; position: relative; }
  #graph-svg { width: 100%; height: 100%; }
  .node circle { stroke-width: 2; cursor: pointer; transition: r .15s; }
  .node circle:hover { stroke-width: 3; }
  .node text { font-size: 11px; fill: var(--text); pointer-events: none; }
  .link { stroke: var(--border); stroke-width: 1.5; fill: none; opacity: .6; }
  .link.highlighted { stroke: var(--accent); opacity: 1; stroke-width: 2; }

  /* TABLE VIEW */
  #table-view { flex: 1; overflow: auto; padding: 20px; display: none; }
  .chain-table { width: 100%; border-collapse: collapse; }
  .chain-table th {
    padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .8px; border-bottom: 2px solid var(--border);
    position: sticky; top: 0; background: var(--bg); z-index: 1;
  }
  .chain-table td { padding: 9px 14px; font-size: 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .chain-table tr:hover td { background: var(--bg2); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }

  /* DETAIL PANEL */
  #detail-panel {
    width: 300px; min-width: 300px; background: var(--bg2); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; transition: width .2s;
  }
  #detail-panel.hidden { width: 0; min-width: 0; }
  #detail-inner { width: 300px; padding: 20px; overflow-y: auto; }
  #detail-inner h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .detail-type { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 16px; }
  .detail-section { margin-bottom: 16px; }
  .detail-section label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .6px; display: block; margin-bottom: 5px; }
  .detail-section p { font-size: 13px; line-height: 1.5; }
  .children-list { list-style: none; }
  .children-list li { padding: 5px 8px; font-size: 12px; border-radius: 4px; margin-bottom: 3px; cursor: pointer; }
  .children-list li:hover { background: var(--bg3); }
  #detail-close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; }

  /* PROFILE MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; display: flex; align-items: center; justify-content: center; display: none; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; width: 480px; max-height: 85vh; overflow-y: auto; }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-header h2 { font-size: 16px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--text2); font-size: 20px; cursor: pointer; }
  .modal-body { padding: 20px 24px; }
  .field-group { margin-bottom: 16px; }
  .field-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; }
  .field-group input, .field-group select, .field-group textarea {
    width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  }
  .field-group input:focus, .field-group select:focus, .field-group textarea:focus { border-color: var(--accent); }
  .field-group textarea { resize: vertical; min-height: 60px; }
  .btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all .15s; }
  .btn-primary { background: var(--accent); color: var(--bg); }
  .btn-primary:hover { opacity: .85; }
  .btn-ghost { background: var(--bg3); border: 1px solid var(--border); color: var(--text); }
  .btn-ghost:hover { border-color: var(--accent); }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  /* ADD NODE MODAL */
  #add-modal .modal { width: 420px; }

  /* TOOLBAR */
  #toolbar {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px; z-index: 50;
  }
  .tool-btn {
    padding: 6px 12px; border-radius: 5px; font-size: 12px; cursor: pointer;
    background: none; border: 1px solid transparent; color: var(--text2); transition: all .15s;
  }
  .tool-btn:hover { background: var(--bg3); color: var(--text); border-color: var(--border); }
  .tool-btn.active { background: var(--bg3); color: var(--text); border-color: var(--border); }

  /* LEGEND */
  #legend {
    position: absolute; top: 16px; left: 16px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; z-index: 50;
  }
  #legend h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--text2); margin-bottom: 8px; }
  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* EMPTY STATE */
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--text2); }
  .empty h3 { font-size: 16px; color: var(--text); }
  .empty p { font-size: 13px; }

  /* TOAST */
  #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 20px; font-size: 13px; z-index: 999; display: none; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div style="display:flex;align-items:center;gap:8px;">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#58a6ff" stroke-width="1.5"/><path d="M5 10h10M10 5v10" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round"/></svg>
    <h1>Chaîne de Valeur des Compétences</h1>
  </div>
  <div class="nav-tabs">
    <div class="nav-tab active" data-view="graph">🕸 Graphe</div>
    <div class="nav-tab" data-view="table">📋 Tableau</div>
    <div class="nav-tab" data-view="columns">📊 Colonnes</div>
  </div>
  <button id="profile-btn" onclick="openProfile()">
    <div class="avatar" id="avatar-initials">?</div>
    <span id="profile-name-btn">Mon Profil</span>
  </button>
</div>

<!-- MAIN -->
<div id="main">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-inner">
      <div class="sidebar-section">
        <h3>Filtres</h3>
        <div class="filter-row"><div class="filter-dot" style="background:var(--metier)"></div><span class="filter-label">Métier</span><input type="checkbox" checked data-type="metier" onchange="updateFilters()"></div>
        <div class="filter-row"><div class="filter-dot" style="background:var(--mission)"></div><span class="filter-label">Missions</span><input type="checkbox" checked data-type="mission" onchange="updateFilters()"></div>
        <div class="filter-row"><div class="filter-dot" style="background:var(--tache)"></div><span class="filter-label">Tâches</span><input type="checkbox" checked data-type="tache" onchange="updateFilters()"></div>
        <div class="filter-row"><div class="filter-dot" style="background:var(--competence)"></div><span class="filter-label">Compétences</span><input type="checkbox" checked data-type="competence" onchange="updateFilters()"></div>
        <div class="filter-row"><div class="filter-dot" style="background:var(--capacite)"></div><span class="filter-label">Capacités humaines</span><input type="checkbox" checked data-type="capacite" onchange="updateFilters()"></div>
      </div>
      <div class="sidebar-section" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" style="flex:1;font-size:12px;" onclick="openAdd()">+ Ajouter</button>
        <button class="btn btn-ghost" style="flex:1;font-size:12px;" onclick="exportData()">↓ Export</button>
      </div>
      <div id="tree-panel"></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <!-- GRAPH -->
    <div id="graph-view">
      <svg id="graph-svg"></svg>
      <div id="legend">
        <h4>Légende</h4>
        <div class="legend-row"><div class="legend-dot" style="background:var(--metier)"></div>Métier</div>
        <div class="legend-row"><div class="legend-dot" style="background:var(--mission)"></div>Mission</div>
        <div class="legend-row"><div class="legend-dot" style="background:var(--tache)"></div>Tâche</div>
        <div class="legend-row"><div class="legend-dot" style="background:var(--competence)"></div>Compétence</div>
        <div class="legend-row"><div class="legend-dot" style="background:var(--capacite)"></div>Capacité humaine</div>
      </div>
      <div id="toolbar">
        <button class="tool-btn" onclick="zoomReset()">⊙ Recentrer</button>
        <button class="tool-btn" onclick="toggleSidebar()">☰ Sidebar</button>
        <button class="tool-btn" id="layout-btn" onclick="toggleLayout()">↕ Vertical</button>
      </div>
    </div>
    <!-- TABLE -->
    <div id="table-view">
      <table class="chain-table" id="chain-table">
        <thead>
          <tr>
            <th style="color:var(--metier)">Métier</th>
            <th style="color:var(--mission)">Mission</th>
            <th style="color:var(--tache)">Tâche</th>
            <th style="color:var(--competence)">Compétence</th>
            <th style="color:var(--capacite)">Capacité humaine</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <!-- COLUMNS -->
    <div id="columns-view" style="display:none;flex:1;overflow:auto;padding:16px;">
      <div id="columns-inner" style="display:flex;gap:12px;min-width:max-content;height:100%;"></div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div id="detail-panel" class="hidden">
    <div style="position:relative;">
      <button id="detail-close" onclick="closeDetail()">×</button>
    </div>
    <div id="detail-inner"></div>
  </div>
</div>

<!-- PROFILE MODAL -->
<div class="modal-overlay" id="profile-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>Mon Profil</h2>
      <button class="modal-close" onclick="closeProfile()">×</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="field-group">
          <label>Prénom</label>
          <input id="p-prenom" type="text" placeholder="Jean">
        </div>
        <div class="field-group">
          <label>Nom</label>
          <input id="p-nom" type="text" placeholder="Dupont">
        </div>
      </div>
      <div class="field-group">
        <label>Titre / Poste actuel</label>
        <input id="p-titre" type="text" placeholder="Conducteur de Travaux senior">
      </div>
      <div class="field-group">
        <label>Entreprise</label>
        <input id="p-entreprise" type="text" placeholder="BTP Construction SA">
      </div>
      <div class="field-group">
        <label>Années d'expérience</label>
        <input id="p-exp" type="number" placeholder="10" min="0">
      </div>
      <div class="field-group">
        <label>Parcours / Formation</label>
        <textarea id="p-parcours" placeholder="BTS Bâtiment, Licence Pro Génie Civil..."></textarea>
      </div>
      <div class="field-group">
        <label>Notes personnelles</label>
        <textarea id="p-notes" placeholder="Objectifs de développement, points forts..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeProfile()">Annuler</button>
      <button class="btn btn-primary" onclick="saveProfile()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- ADD NODE MODAL -->
<div class="modal-overlay" id="add-modal">
  <div class="modal" style="width:420px;">
    <div class="modal-header">
      <h2>Ajouter un élément</h2>
      <button class="modal-close" onclick="closeAdd()">×</button>
    </div>
    <div class="modal-body">
      <div class="field-group">
        <label>Type</label>
        <select id="add-type" onchange="updateAddParents()">
          <option value="metier">Métier</option>
          <option value="mission">Mission</option>
          <option value="tache">Tâche</option>
          <option value="competence">Compétence</option>
          <option value="capacite">Capacité humaine</option>
        </select>
      </div>
      <div class="field-group">
        <label>Titre</label>
        <input id="add-title" type="text" placeholder="Nom de l'élément">
      </div>
      <div class="field-group">
        <label>Description (optionnel)</label>
        <textarea id="add-desc" placeholder="Description..."></textarea>
      </div>
      <div class="field-group" id="parent-group">
        <label>Rattacher à</label>
        <select id="add-parent"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAdd()">Annuler</button>
      <button class="btn btn-primary" onclick="saveNode()">Ajouter</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ===================== DATA =====================
const COLORS = { metier:'#58a6ff', mission:'#3fb950', tache:'#d29922', competence:'#f78166', capacite:'#bc8cff' };
const TYPE_LABELS = { metier:'Métier', mission:'Mission', tache:'Tâche', competence:'Compétence', capacite:'Capacité humaine' };
const PARENT_TYPE = { mission:'metier', tache:'mission', competence:'tache', capacite:'competence' };

function defaultData() {
  return {
    nodes: [
      {id:'m1', type:'metier', title:'Conducteur de Travaux', desc:'Organise, planifie et coordonne les chantiers de construction dans le respect des délais, des coûts, de la qualité et de la sécurité.'},
      // MISSIONS
      {id:'ms1', type:'mission', title:'1. Préparer le chantier', desc:'Préparer toutes les conditions techniques, humaines et administratives du chantier.', parent:'m1'},
      {id:'ms2', type:'mission', title:'2. Organiser et coordonner', desc:'Piloter les moyens humains, matériels et techniques pour réaliser les travaux.', parent:'m1'},
      {id:'ms3', type:'mission', title:'3. Assurer qualité & sécurité', desc:'Garantir la qualité des travaux dans le respect des normes, de la sécurité et des exigences contractuelles.', parent:'m1'},
      {id:'ms4', type:'mission', title:'4. Gérer aspects financiers', desc:'Maîtriser les coûts, suivre les budgets et assurer la rentabilité du chantier.', parent:'m1'},
      // TACHES ms1
      {id:'t1', type:'tache', title:'1.1 Analyser le dossier technique', desc:'Lecture et analyse des plans, pièces écrites, DTU et normes.', parent:'ms1'},
      {id:'t2', type:'tache', title:'1.2 Établir le planning prévisionnel', desc:'Élaboration du planning travaux selon les méthodes de planification.', parent:'ms1'},
      {id:'t3', type:'tache', title:'1.3 Consulter les sous-traitants', desc:'Réaliser des consultations et analyser les offres des fournisseurs.', parent:'ms1'},
      {id:'t4', type:'tache', title:'1.4 Préparer les documents administratifs', desc:'Constituer les dossiers administratifs du chantier.', parent:'ms1'},
      // TACHES ms2
      {id:'t5', type:'tache', title:'2.1 Répartir les tâches entre les équipes', desc:'Organiser et affecter les ressources humaines sur le chantier.', parent:'ms2'},
      {id:'t6', type:'tache', title:'2.2 Coordonner les intervenants', desc:'Coordonner les activités sur le chantier, communication et leadership.', parent:'ms2'},
      {id:'t7', type:'tache', title:'2.3 Suivre l\'avancement des travaux', desc:'Suivre et contrôler l\'avancement du chantier.', parent:'ms2'},
      {id:'t8', type:'tache', title:'2.4 Ajuster l\'organisation', desc:'Gérer les aléas et réajuster le planning, flexibilité et réactivité.', parent:'ms2'},
      // TACHES ms3
      {id:'t9', type:'tache', title:'3.1 Contrôler la qualité', desc:'Contrôler la conformité et la qualité des travaux.', parent:'ms3'},
      {id:'t10', type:'tache', title:'3.2 Veiller aux règles de sécurité', desc:'Appliquer et faire respecter les règles de sécurité, prévention et vigilance.', parent:'ms3'},
      {id:'t11', type:'tache', title:'3.3 Vérifier la conformité', desc:'Vérifier la conformité réglementaire et contractuelle selon les normes.', parent:'ms3'},
      {id:'t12', type:'tache', title:'3.4 Traiter les non-conformités', desc:'Gérer les écarts et actions correctives.', parent:'ms3'},
      // TACHES ms4
      {id:'t13', type:'tache', title:'4.1 Établir et suivre le budget', desc:'Établir et suivre le budget, gestion budgétaire.', parent:'ms4'},
      {id:'t14', type:'tache', title:'4.2 Suivre les dépenses et écarts', desc:'Analyser les écarts et coûts, analyse financière.', parent:'ms4'},
      {id:'t15', type:'tache', title:'4.3 Préparer les situations de travaux', desc:'Élaborer les documents financiers et facturations.', parent:'ms4'},
      {id:'t16', type:'tache', title:'4.4 Clôturer le chantier', desc:'Clôturer administrativement le chantier, levée de réserves et bilan.', parent:'ms4'},
      // COMPETENCES
      {id:'c1', type:'competence', title:'Lecture de plans et normes', desc:'Savoir : Lecture de plans, DTU, normes BTP.', parent:'t1'},
      {id:'c2', type:'competence', title:'Méthodes de planification', desc:'Savoir-faire : Planification de chantier, diagramme de Gantt.', parent:'t2'},
      {id:'c3', type:'competence', title:'Négociation et analyse d\'offres', desc:'Savoir-faire : Négociation, analyse comparative d\'offres.', parent:'t3'},
      {id:'c4', type:'competence', title:'Rédaction et gestion documentaire', desc:'Savoir-faire : Rédaction administrative, gestion de documents.', parent:'t4'},
      {id:'c5', type:'competence', title:'Management d\'équipe', desc:'Savoir-faire : Organisation et affectation des ressources.', parent:'t5'},
      {id:'c6', type:'competence', title:'Communication et leadership', desc:'Savoir-faire : Coordination inter-corps de métier.', parent:'t6'},
      {id:'c7', type:'competence', title:'Suivi de chantier', desc:'Savoir-faire : Tableau de bord, reporting avancement.', parent:'t7'},
      {id:'c8', type:'competence', title:'Flexibilité et réactivité', desc:'Savoir-faire : Gestion des aléas, adaptation rapide.', parent:'t8'},
      {id:'c9', type:'competence', title:'Contrôle et analyse qualité', desc:'Savoir-faire : Contrôle, analyse et vérification de conformité.', parent:'t9'},
      {id:'c10', type:'competence', title:'Prévention et sécurité', desc:'Savoir-faire : Prévention des risques, PPSPS, habilitations.', parent:'t10'},

      {id:'ca11', type:'capacite', title:'Raisonnement logique', desc:'Mémoire à long terme, raisonnement normatif.', parent:'c11'},

let appData = JSON.parse(localStorage.getItem('cvc_data') || 'null') || defaultData();
let currentView = 'graph';
let activeFilters = { metier:true, mission:true, tache:true, competence:true, capacite:true };
let selectedNode = null;
let layoutMode = 'radial'; // 'radial' | 'vertical'
let simulation;

function save() { localStorage.setItem('cvc_data', JSON.stringify(appData)); }
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// ===================== PROFILE =====================
function openProfile() {
  const p = appData.profile;
  document.getElementById('p-prenom').value = p.prenom || '';
  document.getElementById('p-nom').value = p.nom || '';
  document.getElementById('p-titre').value = p.titre || '';
  document.getElementById('p-entreprise').value = p.entreprise || '';
  document.getElementById('p-exp').value = p.exp || '';
  document.getElementById('p-parcours').value = p.parcours || '';
  document.getElementById('p-notes').value = p.notes || '';
  document.getElementById('profile-modal').classList.add('open');
}
function closeProfile() { document.getElementById('profile-modal').classList.remove('open'); }
function saveProfile() {
  appData.profile = {
    prenom: document.getElementById('p-prenom').value,
    nom: document.getElementById('p-nom').value,
    titre: document.getElementById('p-titre').value,
    entreprise: document.getElementById('p-entreprise').value,
    exp: document.getElementById('p-exp').value,
    parcours: document.getElementById('p-parcours').value,
    notes: document.getElementById('p-notes').value,
  };
  save(); updateProfileUI(); closeProfile(); toast('Profil enregistré ✓');
}
function updateProfileUI() {
  const p = appData.profile;
  const name = [p.prenom, p.nom].filter(Boolean).join(' ') || 'Mon Profil';
  document.getElementById('profile-name-btn').textContent = name;
  const initials = [p.prenom?.[0], p.nom?.[0]].filter(Boolean).join('').toUpperCase() || '?';
  document.getElementById('avatar-initials').textContent = initials;
}

// ===================== ADD NODE =====================
function openAdd() {
  document.getElementById('add-title').value = '';
  document.getElementById('add-desc').value = '';
  updateAddParents();
  document.getElementById('add-modal').classList.add('open');
}
function closeAdd() { document.getElementById('add-modal').classList.remove('open'); }
function updateAddParents() {
  const type = document.getElementById('add-type').value;
  const parentType = PARENT_TYPE[type];
  const pg = document.getElementById('parent-group');
  const ps = document.getElementById('add-parent');
  if (!parentType) { pg.style.display='none'; return; }
  pg.style.display = '';
  const parents = appData.nodes.filter(n => n.type === parentType);
  ps.innerHTML = parents.map(n => `<option value="${n.id}">${n.title}</option>`).join('');
}
function saveNode() {
  const title = document.getElementById('add-title').value.trim();
  if (!title) { toast('Le titre est requis'); return; }
  const type = document.getElementById('add-type').value;
  const parentType = PARENT_TYPE[type];
  const node = {
    id: 'n' + Date.now(),
    type, title,
    desc: document.getElementById('add-desc').value.trim(),
  };
  if (parentType) node.parent = document.getElementById('add-parent').value;
  appData.nodes.push(node);
  save(); closeAdd(); render(); toast('Élément ajouté ✓');
}

// ===================== NAV TABS =====================
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentView = tab.dataset.view;
    document.getElementById('graph-view').style.display = currentView === 'graph' ? 'flex' : 'none';
    document.getElementById('table-view').style.display = currentView === 'table' ? 'block' : 'none';
    document.getElementById('columns-view').style.display = currentView === 'columns' ? 'flex' : 'none';
    if (currentView === 'table') renderTable();
    if (currentView === 'columns') renderColumns();
    if (currentView === 'graph') renderGraph();
  });
});

// ===================== FILTERS =====================
function updateFilters() {
  document.querySelectorAll('[data-type]').forEach(cb => {
    activeFilters[cb.dataset.type] = cb.checked;
  });
  renderGraph();
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
  setTimeout(() => renderGraph(), 220);
}

// ===================== TREE =====================
function renderTree() {
  const panel = document.getElementById('tree-panel');
  const metiers = appData.nodes.filter(n => n.type === 'metier');
  let html = '';
  metiers.forEach(m => {
    const missions = appData.nodes.filter(n => n.type === 'mission' && n.parent === m.id);
    html += `<div class="tree-metier" onclick="focusNode('${m.id}')">
      <span class="chevron open" id="chev-${m.id}">▶</span>${m.title}
    </div>`;
    missions.forEach(ms => {
      const taches = appData.nodes.filter(n => n.type === 'tache' && n.parent === ms.id);
      html += `<div class="tree-mission" onclick="focusNode('${ms.id}')">${ms.title}</div>`;
      taches.forEach(t => {
        html += `<div class="tree-tache" onclick="focusNode('${t.id}')">${t.title}</div>`;
      });
    });
  });
  panel.innerHTML = html;
}

// ===================== DETAIL PANEL =====================
function showDetail(node) {
  selectedNode = node;
  const panel = document.getElementById('detail-panel');
  const inner = document.getElementById('detail-inner');
  panel.classList.remove('hidden');
  const children = appData.nodes.filter(n => n.parent === node.id);
  const parent = node.parent ? appData.nodes.find(n => n.id === node.parent) : null;
  inner.innerHTML = `
    <div style="position:relative;padding-right:24px;">
      <button id="detail-close" onclick="closeDetail()" style="position:absolute;top:0;right:0;background:none;border:none;color:var(--text2);cursor:pointer;font-size:18px;">×</button>
      <div class="detail-type" style="color:${COLORS[node.type]}">${TYPE_LABELS[node.type]}</div>
      <h2>${node.title}</h2>
    </div>
    ${node.desc ? `<div class="detail-section" style="margin-top:12px;"><label>Description</label><p>${node.desc}</p></div>` : ''}
    ${parent ? `<div class="detail-section"><label>Rattaché à</label><p style="cursor:pointer;color:${COLORS[parent.type]}" onclick="focusNode('${parent.id}')">${parent.title}</p></div>` : ''}
    ${children.length ? `<div class="detail-section"><label>${children.length} élément(s) lié(s)</label><ul class="children-list">${children.map(c => `<li style="color:${COLORS[c.type]}" onclick="focusNode('${c.id}')">${c.title}</li>`).join('')}</ul></div>` : ''}
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn btn-ghost" style="flex:1;font-size:12px;" onclick="editNode('${node.id}')">✏ Modifier</button>
      <button class="btn" style="flex:1;font-size:12px;background:#da3633;color:#fff;" onclick="deleteNode('${node.id}')">🗑 Supprimer</button>
    </div>
  `;
}
function closeDetail() {
  document.getElementById('detail-panel').classList.add('hidden');
  selectedNode = null;
}
function deleteNode(id) {
  if (!confirm('Supprimer cet élément et tous ses enfants ?')) return;
  const toDelete = new Set();
  function collectChildren(nid) {
    toDelete.add(nid);
    appData.nodes.filter(n => n.parent === nid).forEach(c => collectChildren(c.id));
  }
  collectChildren(id);
  appData.nodes = appData.nodes.filter(n => !toDelete.has(n.id));
  save(); closeDetail(); render(); toast('Supprimé ✓');
}
function editNode(id) {
  const node = appData.nodes.find(n => n.id === id);
  const title = prompt('Titre :', node.title);
  if (title === null) return;
  const desc = prompt('Description :', node.desc || '');
  node.title = title || node.title;
  node.desc = desc !== null ? desc : node.desc;
  save(); render(); toast('Modifié ✓');
}

// ===================== GRAPH =====================
let zoom;
function renderGraph() {
  const svg = d3.select('#graph-svg');
  svg.selectAll('*').remove();
  const el = document.getElementById('graph-svg');
  const W = el.clientWidth || 900, H = el.clientHeight || 600;

  const filteredNodes = appData.nodes.filter(n => activeFilters[n.type]);
  const filteredIds = new Set(filteredNodes.map(n => n.id));
  const links = filteredNodes
    .filter(n => n.parent && filteredIds.has(n.parent))
    .map(n => ({ source: n.parent, target: n.id }));

  zoom = d3.zoom().scaleExtent([.1, 3]).on('zoom', e => g.attr('transform', e.transform));
  svg.call(zoom);
  const g = svg.append('g');

  // Build simulation
  const nodeMap = {};
  filteredNodes.forEach(n => nodeMap[n.id] = {...n});
  const simNodes = Object.values(nodeMap);
  const simLinks = links.map(l => ({ source: l.source, target: l.target }));

  const typeOrder = ['metier','mission','tache','competence','capacite'];
  const typeRadius = { metier: 28, mission: 20, tache: 14, competence: 11, capacite: 9 };

  if (layoutMode === 'radial') {
    // Radial hierarchical layout
    const hierarchy = { metier: [], mission: [], tache: [], competence: [], capacite: [] };
    simNodes.forEach(n => hierarchy[n.type]?.push(n));
    const centerX = W/2, centerY = H/2;
    const radii = { metier: 0, mission: 150, tache: 300, competence: 450, capacite: 580 };
    hierarchy.metier.forEach(n => { n.x = centerX; n.y = centerY; n.fx = centerX; n.fy = centerY; });
    Object.entries(hierarchy).forEach(([type, nodes]) => {
      if (type === 'metier') return;
      nodes.forEach((n, i) => {
        const angle = (2 * Math.PI * i / nodes.length) - Math.PI/2;
        n.x = centerX + Math.cos(angle) * radii[type];
        n.y = centerY + Math.sin(angle) * radii[type];
      });
    });
  } else {
    // Vertical layout
    const cols = { metier: W*0.1, mission: W*0.25, tache: W*0.43, competence: W*0.63, capacite: W*0.82 };
    const counts = {};
    typeOrder.forEach(t => { counts[t] = simNodes.filter(n => n.type === t).length; });
    const placed = {};
    typeOrder.forEach(t => { placed[t] = 0; });
    simNodes.forEach(n => {
      const idx = placed[n.type]++;
      const total = counts[n.type];
      n.x = cols[n.type]; n.y = H * (idx + 1) / (total + 1);
      n.fx = n.x; n.fy = n.y;
    });
  }

  simulation = d3.forceSimulation(simNodes)
    .force('link', d3.forceLink(simLinks).id(d => d.id).distance(d => {
      const levels = { metier:0,mission:1,tache:2,competence:3,capacite:4 };
      return 80 + Math.abs(levels[d.source.type||'metier'] - levels[d.target.type||'mission']) * 20;
    }).strength(.5))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('collision', d3.forceCollide(d => typeRadius[d.type] * 2.2))
    .alphaDecay(.04);

  if (layoutMode !== 'radial') simulation.stop();

  // Links
  const link = g.append('g').selectAll('line')
    .data(simLinks).join('line')
    .attr('class','link')
    .attr('stroke', d => {
      const src = simNodes.find(n => n.id === (d.source.id || d.source));
      return src ? COLORS[src.type] : '#30363d';
    })
    .attr('stroke-opacity', .4);

  // Nodes
  const node = g.append('g').selectAll('g')
    .data(simNodes).join('g')
    .attr('class','node')
    .call(d3.drag()
      .on('start', (e,d) => { if (!e.active) simulation.alphaTarget(.1).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
      .on('end', (e,d) => { if (!e.active) simulation.alphaTarget(0); })
    )
    .on('click', (e, d) => { e.stopPropagation(); showDetail(d); highlightNode(d, link, node); });

  node.append('circle')
    .attr('r', d => typeRadius[d.type])
    .attr('fill', d => COLORS[d.type] + '22')
    .attr('stroke', d => COLORS[d.type])
    .attr('stroke-width', 2);

  node.append('text')
    .attr('text-anchor','middle')
    .attr('dy', d => typeRadius[d.type] + 13)
    .attr('font-size', d => d.type === 'metier' ? 12 : 10)
    .attr('fill', '#e6edf3')
    .attr('font-weight', d => d.type === 'metier' ? 700 : 400)
    .text(d => d.title.length > 22 ? d.title.slice(0,20)+'…' : d.title);

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });

  svg.on('click', () => closeDetail());

  // Initial center
  const initT = d3.zoomIdentity.translate(0,0).scale(layoutMode === 'vertical' ? .85 : .75);
  svg.call(zoom.transform, initT);
}

function highlightNode(d, link, node) {
  link.classed('highlighted', l =>
    (l.source.id || l.source) === d.id || (l.target.id || l.target) === d.id
  );
}

function focusNode(id) {
  const node = appData.nodes.find(n => n.id === id);
  if (node) showDetail(node);
  if (currentView !== 'graph') return;
}

function zoomReset() {
  const svg = d3.select('#graph-svg');
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(0,0).scale(.75));
}

function toggleLayout() {
  layoutMode = layoutMode === 'radial' ? 'vertical' : 'radial';
  document.getElementById('layout-btn').textContent = layoutMode === 'radial' ? '↕ Vertical' : '⊙ Radial';
  renderGraph();
}

// ===================== TABLE =====================
function renderTable() {
  const tbody = document.getElementById('table-body');
  const metiers = appData.nodes.filter(n => n.type === 'metier');
  let rows = [];
  metiers.forEach(m => {
    const missions = appData.nodes.filter(n => n.type === 'mission' && n.parent === m.id);
    if (!missions.length) { rows.push({ m, ms: null, t: null, c: null, ca: null }); return; }
    missions.forEach(ms => {
      const taches = appData.nodes.filter(n => n.type === 'tache' && n.parent === ms.id);
      if (!taches.length) { rows.push({ m, ms, t: null, c: null, ca: null }); return; }
      taches.forEach(t => {
        const comps = appData.nodes.filter(n => n.type === 'competence' && n.parent === t.id);
        if (!comps.length) { rows.push({ m, ms, t, c: null, ca: null }); return; }
        comps.forEach(c => {
          const caps = appData.nodes.filter(n => n.type === 'capacite' && n.parent === c.id);
          if (!caps.length) { rows.push({ m, ms, t, c, ca: null }); return; }
          caps.forEach(ca => rows.push({ m, ms, t, c, ca }));
        });
      });
    });
  });
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td><span class="tag" style="background:${COLORS.metier}22;color:${COLORS.metier}">${r.m?.title||'—'}</span></td>
      <td style="color:${COLORS.mission}">${r.ms?.title||'—'}</td>
      <td style="color:${COLORS.tache}">${r.t?.title||'—'}</td>
      <td style="color:${COLORS.competence}">${r.c?.title||'—'}</td>
      <td style="color:${COLORS.capacite}">${r.ca?.title||'—'}</td>
    </tr>
  `).join('');
}

// ===================== COLUMNS =====================
function renderColumns() {
  const types = ['metier','mission','tache','competence','capacite'];
  const inner = document.getElementById('columns-inner');
  inner.innerHTML = types.map(type => {
    const nodes = appData.nodes.filter(n => n.type === type);
    return `
      <div style="width:220px;flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;">
        <div style="padding:10px 14px;border-bottom:1px solid var(--border);background:${COLORS[type]}18;">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:${COLORS[type]}">${TYPE_LABELS[type]}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${nodes.length} élément(s)</div>
        </div>
        <div style="padding:8px;overflow-y:auto;max-height:calc(100vh - 160px);">
          ${nodes.map(n => `
            <div onclick="showDetail(appData.nodes.find(x=>x.id==='${n.id}'))" style="padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;border:1px solid var(--border);font-size:12px;line-height:1.4;transition:all .15s;" onmouseover="this.style.borderColor='${COLORS[type]}'" onmouseout="this.style.borderColor='var(--border)'">
              <div style="font-weight:600;color:${COLORS[type]}">${n.title}</div>
              ${n.desc ? `<div style="color:var(--text2);margin-top:3px;font-size:11px">${n.desc.slice(0,60)}${n.desc.length>60?'…':''}</div>` : ''}
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ===================== EXPORT =====================
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'competences_data.json'; a.click();
  toast('Export JSON téléchargé ✓');
}

// ===================== RENDER =====================
function render() { renderTree(); if (currentView === 'graph') renderGraph(); else if (currentView === 'table') renderTable(); else renderColumns(); }

// ===================== INIT =====================
updateProfileUI();
render();
window.addEventListener('resize', () => { if (currentView === 'graph') renderGraph(); });
</script>
