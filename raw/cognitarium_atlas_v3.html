<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cognitarium — Atlas UI v3</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

body {
  margin: 0;
  font-family: 'Inter', Arial, sans-serif;
  background: #0a0f18;
  color: white;
  overflow: hidden;
}

body::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

#app {
  display: flex;
  height: 100vh;
}

/* ================= LEFT SIDEBAR ================= */
#sidebar {
  width: 260px;
  background: rgba(10,15,25,0.9);
  backdrop-filter: blur(20px);
  border-right: 1px solid rgba(255,255,255,0.06);
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#sidebar .logo {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #7ab0ff;
}

#sidebar .logo span {
  font-size: 22px;
}

input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: white;
  box-sizing: border-box;
  margin-bottom: 8px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}

input:focus {
  border-color: rgba(122,176,255,0.4);
}

input::placeholder {
  color: rgba(255,255,255,0.3);
}

/* COLLAPSIBLE SECTIONS */
.collapsible-section {
  border-radius: 10px;
  overflow: hidden;
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.2s;
  font-size: 13px;
  font-weight: 500;
}

.section-header:hover {
  background: rgba(255,255,255,0.08);
}

.section-header .arrow {
  transition: transform 0.3s ease;
  font-size: 10px;
  opacity: 0.5;
}

.section-header.expanded .arrow {
  transform: rotate(90deg);
}

.section-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.3s ease;
  padding: 0 6px;
}

.section-content.open {
  max-height: 600px;
  padding: 6px;
}

.section-content button {
  margin-top: 4px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.03);
  color: white;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-content button:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(122,176,255,0.2);
}

.section-content button.active {
  background: rgba(122,176,255,0.15);
  border-color: rgba(122,176,255,0.3);
  color: #7ab0ff;
}

/* ================= CENTER GRAPH AREA ================= */
#graph-area {
  flex: 1;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* TOP VIEW BAR */
#view-bar {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: rgba(10,15,25,0.8);
  backdrop-filter: blur(20px);
  padding: 6px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  z-index: 100;
}

#view-bar button {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
  white-space: nowrap;
}

#view-bar button:hover {
  color: white;
  background: rgba(255,255,255,0.06);
}

#view-bar button.active {
  background: rgba(122,176,255,0.2);
  color: #7ab0ff;
}

/* BREADCRUMB */
#breadcrumb {
  position: absolute;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  align-items: center;
  z-index: 100;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

#breadcrumb.visible {
  opacity: 1;
  pointer-events: auto;
}

.breadcrumb-item {
  padding: 6px 12px;
  background: rgba(122,176,255,0.1);
  border: 1px solid rgba(122,176,255,0.2);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}

.breadcrumb-item:hover {
  background: rgba(122,176,255,0.2);
}

.breadcrumb-sep {
  color: rgba(255,255,255,0.3);
  font-size: 12px;
}

/* SVG GRAPH */
#graph {
  flex: 1;
  width: 100%;
}

/* ================= RIGHT PANEL ================= */
#panel {
  width: 300px;
  background: rgba(10,15,25,0.9);
  backdrop-filter: blur(20px);
  border-left: 1px solid rgba(255,255,255,0.06);
  padding: 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

#panel h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}

#panel #type {
  opacity: 0.5;
  font-size: 13px;
  margin-top: -8px;
}

.panel-section {
  border-top: 1px solid rgba(255,255,255,0.06);
  padding-top: 12px;
}

.panel-section-title {
  font-size: 11px;
  opacity: 0.5;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
  font-weight: 600;
}

#panel button {
  padding: 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.04);
  color: white;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
  width: 100%;
  margin-top: 6px;
}

#panel button:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(122,176,255,0.3);
}

#panel button.primary {
  background: rgba(122,176,255,0.15);
  border-color: rgba(122,176,255,0.3);
  color: #7ab0ff;
}

#panel button.primary:hover {
  background: rgba(122,176,255,0.25);
}

#list {
  list-style: none;
  padding: 0;
  margin: 0;
}

#list li {
  padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  margin-bottom: 4px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}

#list li:hover {
  background: rgba(255,255,255,0.06);
  border-color: rgba(122,176,255,0.2);
}

#ai {
  padding: 12px;
  background: rgba(122,176,255,0.05);
  border-radius: 10px;
  border: 1px solid rgba(122,176,255,0.1);
  font-size: 13px;
  line-height: 1.5;
  color: rgba(255,255,255,0.8);
  min-height: 60px;
}

/* ================= GRAPH STYLES ================= */
.node circle {
  stroke: rgba(255,255,255,0.2);
  stroke-width: 1.5px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.node:hover circle {
  stroke: #7ab0ff;
  stroke-width: 2.5px;
  filter: drop-shadow(0 0 10px rgba(122,176,255,0.6));
}

.node text {
  font-size: 11px;
  fill: white;
  pointer-events: none;
  font-weight: 500;
}

.node .node-label {
  font-size: 10px;
  fill: rgba(255,255,255,0.7);
  pointer-events: none;
}

.link {
  fill: none;
  stroke: rgba(255,255,255,0.12);
  stroke-width: 1.5px;
  transition: all 0.3s;
}

.link.highlight {
  stroke: #7ab0ff;
  stroke-width: 2.5px;
  filter: drop-shadow(0 0 4px rgba(122,176,255,0.4));
}

.link.dimmed {
  stroke-opacity: 0.05;
}

/* ORBIT RINGS */
.orbit-ring {
  fill: none;
  stroke: rgba(255,255,255,0.04);
  stroke-dasharray: 3,6;
  pointer-events: none;
}

/* LEVEL LABELS */
.level-label-bg {
  fill: rgba(10,15,25,0.8);
}

.level-label {
  font-size: 10px;
  fill: rgba(255,255,255,0.25);
  text-anchor: middle;
  pointer-events: none;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* EARTH */
.earth-glow {
  filter: drop-shadow(0 0 30px rgba(74, 222, 128, 0.3));
}

/* ANIMATIONS */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.pulsing {
  animation: pulse 2s infinite;
}

/* TOOLTIP */
.tooltip {
  position: absolute;
  background: rgba(10,15,25,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 200;
  backdrop-filter: blur(10px);
}

/* JOB SELECTOR MODAL */
#job-selector {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(15,20,35,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 24px;
  min-width: 300px;
  z-index: 300;
  backdrop-filter: blur(20px);
  display: none;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

#job-selector.visible {
  display: block;
}

#job-selector h3 {
  margin: 0 0 16px 0;
  font-size: 16px;
}

.job-option {
  padding: 10px 14px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  display: flex;
  align-items: center;
  gap: 10px;
}

.job-option:hover {
  background: rgba(122,176,255,0.1);
  border-color: rgba(122,176,255,0.2);
}

.job-option .job-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  flex-shrink: 0;
}

#job-selector .close-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  cursor: pointer;
  font-size: 18px;
  width: auto;
  margin: 0;
  padding: 4px;
}

/* PROGRESS BAR */
.progress-bar {
  width: 100%;
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 6px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #7ab0ff, #a78bfa);
  border-radius: 3px;
  transition: width 0.5s ease;
}

/* HIDDEN */
.hidden {
  opacity: 0;
  pointer-events: none;
}

.node.dimmed {
  opacity: 0.1;
}
</style>
</head>

<body>

<div id="app">

<!-- LEFT SIDEBAR -->
<div id="sidebar">
  <div class="logo"><span>🌍</span> Cognitarium</div>

  <input placeholder="Rechercher..." id="searchInput" oninput="handleSearch()"/>

  <div class="collapsible-section">
    <div class="section-header" onclick="toggleSection(this)">
      <span>🎯 Focus</span>
      <span class="arrow">▶</span>
    </div>
    <div class="section-content">
      <button onclick="focusOn('terre')">🌍 Terre</button>
      <button onclick="focusOn('france')">🇫🇷 France</button>
      <button onclick="focusOn('paris')">🗼 Paris</button>
      <button onclick="focusOn('btp')">🏗️ BTP</button>
      <button onclick="focusOn('tech')">💻 Tech</button>
      <button onclick="resetFocus()">🔄 Réinitialiser</button>
    </div>
  </div>

  <div class="collapsible-section">
    <div class="section-header" onclick="toggleSection(this)">
      <span>🔍 Filtres</span>
      <span class="arrow">▶</span>
    </div>
    <div class="section-content">
      <button onclick="filterType('all')" id="btn-all" class="active">Tout afficher</button>
      <button onclick="filterType('job')" id="btn-job">Métiers uniquement</button>
      <button onclick="filterType('skill')" id="btn-skill">Skills uniquement</button>
      <button onclick="filterType('location')" id="btn-loc">Lieux uniquement</button>
    </div>
  </div>
</div>

<!-- CENTER GRAPH -->
<div id="graph-area">
  <!-- TOP VIEW BAR -->
  <div id="view-bar">
    <button onclick="setView('global')" id="vbtn-global" class="active">🌍 Vue Globale</button>
    <button onclick="setView('personal')" id="vbtn-personal">👤 Vue Personnelle</button>
    <button onclick="setView('detail')" id="vbtn-detail">🔍 Vue Détaillée</button>
  </div>

  <!-- BREADCRUMB -->
  <div id="breadcrumb"></div>

  <!-- JOB SELECTOR MODAL -->
  <div id="job-selector">
    <button class="close-btn" onclick="closeJobSelector()">×</button>
    <h3>🔍 Choisir un métier validé</h3>
    <div id="job-list"></div>
  </div>

  <svg id="graph"></svg>
</div>

<!-- RIGHT PANEL -->
<div id="panel">
  <h2 id="title">Sélectionner un nœud</h2>
  <div id="type">Cliquez sur la Terre pour explorer</div>

  <div class="panel-section">
    <div class="panel-section-title">Progression</div>
    <div id="progress-text">--</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
    </div>
  </div>

  <div class="panel-section">
    <div class="panel-section-title">Chemin hiérarchique</div>
    <div id="hierarchy-path" style="font-size: 12px; opacity: 0.7; line-height: 1.6;">---</div>
  </div>

  <div class="panel-section">
    <div class="panel-section-title">Connectés</div>
    <ul id="list"></ul>
  </div>

  <div class="panel-section">
    <div class="panel-section-title">Analyse IA</div>
    <div id="ai">Sélectionnez un nœud pour obtenir une analyse.</div>
  </div>

  <button class="primary" onclick="runAI()">🤖 Lancer Analyse</button>
  <button onclick="findPath()">🛤️ Trouver Chemin</button>
</div>

</div>

<div class="tooltip" id="tooltip"></div>

let allNodes = [];

let nodeMap = {};

function flattenTree(node, parentId = null) {
  const flatNode = { ...node, parentId };
  allNodes.push(flatNode);
  nodeMap[node.id] = flatNode;

  if (parentId) {
    allLinks.push({ source: parentId, target: node.id, type: "hierarchy" });
  }

  if (node.children) {
    node.children.forEach(child => flattenTree(child, node.id));
  }
}

};

// ======================== LAYOUT ========================
function computeRadialLayout() {
  const visible = allNodes.filter(n => {
    if (n.id === "terre") return true;
    // Check if any ancestor is expanded
    let parent = nodeMap[n.parentId];
    while (parent) {
      if (!expandedNodes.has(parent.id)) return false;
      parent = nodeMap[parent.parentId];
    }
    return true;
  });

  // Group by level
  const byLevel = {};
  visible.forEach(n => {
    if (!byLevel[n.level]) byLevel[n.level] = [];
    byLevel[n.level].push(n);
  });

  // Position each level
  const positions = {};
  Object.keys(byLevel).forEach(lvl => {
    const nodes = byLevel[lvl];
    const radius = radii[lvl] || 100;
    const angleStep = (2 * Math.PI) / Math.max(nodes.length, 1);

    nodes.forEach((n, i) => {
      const angle = i * angleStep - Math.PI / 2;
      positions[n.id] = {
        x: radius * Math.cos(angle),
        y: radius * Math.sin(angle),
        angle,
        radius
      };
    });
  });

  // Filter links to only visible nodes
  const links = allLinks.filter(l => {
    return visible.some(n => n.id === l.source) && visible.some(n => n.id === l.target);
  });

  return { visible, links, positions };
}

// ======================== RENDER ========================
function render() {
  const { visible, links, positions } = computeRadialLayout();
  visibleNodes = visible;
  visibleLinks = links;

  // Clear and redraw
  g.selectAll("*").remove();

  // Draw orbit rings
  const maxLevel = Math.max(...visible.map(n => n.level));
  for (let i = 1; i <= maxLevel; i++) {
    g.append("circle")
      .attr("class", "orbit-ring")
      .attr("r", radii[i] || 100);
  }

  // Draw level labels
  const levelNames = ["", "Pays", "Villes", "Secteurs", "Sous-secteurs", "Métiers", "Skills"];
  for (let i = 1; i <= maxLevel; i++) {
    const r = radii[i] || 100;
    g.append("text")
      .attr("class", "level-label")
      .attr("y", -r - 8)
      .text(levelNames[i] || `Niveau ${i}`);
  }

  // Draw links
  const linkSel = g.selectAll(".link")
    .data(links)
    .enter()
    .append("path")
    .attr("class", "link")
    .attr("d", d => {
      const s = positions[d.source];
      const t = positions[d.target];
      if (!s || !t) return "";

      // Curved lines for hierarchy, straight for skills
      if (d.type === "hierarchy") {
        return d3.linkRadial()
          .angle(d => d.angle)
          .radius(d => d.radius)({
            source: { angle: s.angle + Math.PI/2, radius: s.radius },
            target: { angle: t.angle + Math.PI/2, radius: t.radius }
          });
      } else {
        return `M${s.x},${s.y} L${t.x},${t.y}`;
      }
    })
    .style("stroke", d => d.type === "skill" ? "rgba(45,212,191,0.3)" : null)
    .style("stroke-dasharray", d => d.type === "skill" ? "4,4" : null);

  // Draw nodes
  const nodeSel = g.selectAll(".node")
    .data(visible)
    .enter()
    .append("g")
    .attr("class", "node")
    .attr("transform", d => {
      const p = positions[d.id];
      return p ? `translate(${p.x},${p.y})` : "translate(0,0)";
    })
    .on("click", (e, d) => handleNodeClick(e, d))
    .on("mouseover", (e, d) => showTooltip(e, d))
    .on("mouseout", hideTooltip);

  // Circles
  nodeSel.append("circle")
    .attr("r", d => {
      if (d.type === "earth") return 32;
      if (d.type === "job") return 14;
      if (d.type === "skill") return 10;
      return 18 - d.level * 2;
    })
    .attr("fill", d => colors[d.type] || "#7ab0ff")
    .attr("stroke", d => {
      if (d.type === "job" && d.validated) return "#4ade80";
      return "rgba(255,255,255,0.2)";
    })
    .attr("stroke-width", d => {
      if (d.type === "job" && d.validated) return 3;
      return 1.5;
    })
    .style("filter", d => d.type === "earth" ? "drop-shadow(0 0 20px rgba(74,222,128,0.4))" : null);

  // Labels
  nodeSel.append("text")
    .attr("class", "node-label")
    .attr("dy", d => {
      if (d.type === "earth") return 5;
      return d.type === "job" || d.type === "skill" ? 4 : 5;
    })
    .attr("text-anchor", "middle")
    .style("font-size", d => d.type === "earth" ? "14px" : "10px")
    .text(d => {
      if (d.type === "earth") return "🌍";
      // Extract emoji from label
      return d.label ? d.label.split(" ")[0] : "";
    });

  // External labels for non-earth
  nodeSel.append("text")
    .attr("class", "node-label")
    .attr("dy", d => {
      const r = d.type === "earth" ? 32 : (d.type === "job" ? 14 : (d.type === "skill" ? 10 : 18 - d.level * 2));
      return r + 14;
    })
    .attr("text-anchor", "middle")
    .text(d => d.type === "earth" ? "" : (d.label ? d.label.split(" ").slice(1).join(" ") : d.id));

  // Expand indicator (plus sign for nodes with hidden children)
  nodeSel.each(function(d) {
    const hasHiddenChildren = d.children && d.children.some(c => !expandedNodes.has(c.id));
    const hasChildren = d.children && d.children.length > 0;

    if (hasChildren) {
      const isExpanded = expandedNodes.has(d.id);
      const indicator = d3.select(this).append("g")
        .attr("class", "expand-indicator")
        .attr("transform", d => {
          const r = d.type === "earth" ? 32 : (d.type === "job" ? 14 : (d.type === "skill" ? 10 : 18 - d.level * 2));
          return `translate(${r + 5}, ${-r - 5})`;
        })
        .style("cursor", "pointer")
        .style("opacity", isExpanded ? 0.3 : 0.8);

      indicator.append("circle")
        .attr("r", 6)
        .attr("fill", isExpanded ? "#ef4444" : "#4ade80");

      indicator.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", 3)
        .style("font-size", "10px")
        .style("fill", "white")
        .text(isExpanded ? "−" : "+");
    }
  });

  // Animate entrance
  g.style("opacity", 0)
    .transition()
    .duration(500)
    .style("opacity", 1);
}

// ======================== INTERACTION ========================
function handleNodeClick(event, d) {
  event.stopPropagation();
  selectedNode = d;

  // Toggle expansion
  if (d.children && d.children.length > 0) {
    if (expandedNodes.has(d.id)) {
      // Collapse: remove this and all descendants from expanded
      function collapse(node) {
        expandedNodes.delete(node.id);
        if (node.children) node.children.forEach(collapse);
      }
      collapse(d);
    } else {
      expandedNodes.add(d.id);
    }
    updateBreadcrumb();
    render();
  }

  updatePanel(d);
}

function updatePanel(d) {
  document.getElementById("title").innerText = d.label || d.id;
  document.getElementById("type").innerText = `${d.type.toUpperCase()} — Niveau ${d.level}`;

  // Progress
  const progress = d.type === "job" && d.validated ? 100 : Math.floor(Math.random() * 80);
  document.getElementById("progress-text").innerText = `${progress}%`;
  document.getElementById("progress-bar").style.width = `${progress}%`;

  // Hierarchy path
  const path = getHierarchyPath(d.id);
  document.getElementById("hierarchy-path").innerHTML = path.map((p, i) => 
    `<span style="opacity:${0.4 + i*0.15}">${p.label}</span>`
  ).join(" <span style='opacity:0.3'>→</span> ");

  // Connected nodes
  const connected = allLinks.filter(l => l.source === d.id || l.target === d.id);
  const list = document.getElementById("list");
  list.innerHTML = "";

  connected.forEach(l => {
    const otherId = l.source === d.id ? l.target : l.source;
    const other = nodeMap[otherId];
    if (!other) return;

    const li = document.createElement("li");
    li.innerHTML = `${other.label || other.id} <span style="opacity:0.4;font-size:11px">(${l.type})</span>`;
    li.onclick = () => {
      const nodeData = visibleNodes.find(n => n.id === otherId);
      if (nodeData) {
        // Ensure ancestors are expanded
        let parent = nodeMap[otherId];
        while (parent && parent.parentId) {
          expandedNodes.add(parent.parentId);
          parent = nodeMap[parent.parentId];
        }
        render();
        updatePanel(nodeData);
      }
    };
    list.appendChild(li);
  });

  // AI insight
  document.getElementById("ai").innerText = getAIInsight(d);
}

function getHierarchyPath(nodeId) {
  const path = [];
  let current = nodeMap[nodeId];
  while (current) {
    path.unshift(current);
    current = nodeMap[current.parentId];
  }
  return path;
}

function updateBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  bc.innerHTML = "";

  if (expandedNodes.size <= 1) {
    bc.classList.remove("visible");
    return;
  }

  bc.classList.add("visible");

  // Get deepest expanded node
  let deepest = null;
  let maxLevel = -1;
  expandedNodes.forEach(id => {
    const n = nodeMap[id];
    if (n && n.level > maxLevel) {
      maxLevel = n.level;
      deepest = n;
    }
  });

  if (!deepest) return;

  const path = getHierarchyPath(deepest.id);
  path.forEach((p, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "breadcrumb-sep";
      sep.innerText = "›";
      bc.appendChild(sep);
    }

    const item = document.createElement("span");
    item.className = "breadcrumb-item";
    item.innerText = p.label || p.id;
    item.onclick = () => {
      // Collapse everything below this level
      const targetLevel = p.level;
      expandedNodes.forEach(id => {
        const n = nodeMap[id];
        if (n && n.level > targetLevel) {
          expandedNodes.delete(id);
        }
      });
      render();
      updateBreadcrumb();
    };
    bc.appendChild(item);
  });
}

function setView(view) {
  currentView = view;

  // Update buttons
  document.querySelectorAll("#view-bar button").forEach(btn => btn.classList.remove("active"));
  document.getElementById(`vbtn-${view}`).classList.add("active");

  if (view === "global") {
    // Show all expanded nodes
    expandedNodes.clear();
    expandedNodes.add("terre");
    render();
    updateBreadcrumb();

  } else if (view === "personal") {
    // Show only user's validated jobs and their paths
    expandedNodes.clear();
    expandedNodes.add("terre");

    // Expand path to each validated job
    userProfile.validatedJobs.forEach(jobId => {
      let node = nodeMap[jobId];
      while (node && node.parentId) {
        expandedNodes.add(node.parentId);
        node = nodeMap[node.parentId];
      }
    });

    render();
    updateBreadcrumb();

    // Highlight validated jobs
    setTimeout(() => {
      d3.selectAll(".node").style("opacity", d => {
        if (d.id === "terre") return 1;
        if (d.type === "job" && d.validated) return 1;
        if (expandedNodes.has(d.id)) return 0.6;
        return 0.1;
      });
    }, 100);

  } else if (view === "detail") {
    // Show job selector
    showJobSelector();
  }
}

function showJobSelector() {
  const selector = document.getElementById("job-selector");
  const list = document.getElementById("job-list");
  list.innerHTML = "";

  const validatedJobs = allNodes.filter(n => n.type === "job" && n.validated);

  if (validatedJobs.length === 0) {
    list.innerHTML = "<div style='opacity:0.5;padding:10px;'>Aucun métier validé</div>";
  } else {
    validatedJobs.forEach(job => {
      const div = document.createElement("div");
      div.className = "job-option";
      div.innerHTML = `<div class="job-status"></div><span>${job.label || job.id}</span>`;
      div.onclick = () => {
        selectJobForDetail(job);
        closeJobSelector();
      };
      list.appendChild(div);
    });
  }

  selector.classList.add("visible");
}

function closeJobSelector() {
  document.getElementById("job-selector").classList.remove("visible");
}

function selectJobForDetail(job) {
  // Expand full path to this job and show all its skills
  expandedNodes.clear();
  expandedNodes.add("terre");

  let node = nodeMap[job.id];
  while (node && node.parentId) {
    expandedNodes.add(node.parentId);
    node = nodeMap[node.parentId];
  }

  // Also expand to show skills
  // (skills are already in the data, just need to make sure job is visible)

  render();
  updateBreadcrumb();
  updatePanel(job);

  // Highlight the job and its skills
  setTimeout(() => {
    d3.selectAll(".node").style("opacity", d => {
      if (d.id === job.id) return 1;
      if (d.id === "terre") return 0.3;
      // Show skills connected to this job
      const jobSkills = skillLinks.find(sl => sl.job === job.id);
      if (jobSkills && jobSkills.skills.includes(d.id)) return 1;
      if (expandedNodes.has(d.id)) return 0.4;
      return 0.1;
    });

    d3.selectAll(".link").style("opacity", l => {
      if (l.source === job.id || l.target === job.id) return 1;
      return 0.05;
    });
  }, 100);
}

// ======================== FILTERS ========================
function filterType(type) {
  document.querySelectorAll("#sidebar .section-content button").forEach(btn => {
    if (btn.id && btn.id.startsWith("btn-")) btn.classList.remove("active");
  });
  if (document.getElementById(`btn-${type}`)) {
    document.getElementById(`btn-${type}`).classList.add("active");
  }

  d3.selectAll(".node").transition().duration(400)
    .style("opacity", d => {
      if (type === "all") return 1;
      if (type === "job" && d.type === "job") return 1;
      if (type === "skill" && d.type === "skill") return 1;
      if (type === "location" && ["earth", "country", "city"].includes(d.type)) return 1;
      return 0.1;
    });

  d3.selectAll(".link").transition().duration(400)
    .style("opacity", d => {
      if (type === "all") return 1;
      const s = nodeMap[d.source];
      const t = nodeMap[d.target];
      if (type === "job" && (s.type === "job" || t.type === "job")) return 1;
      if (type === "skill" && (s.type === "skill" || t.type === "skill")) return 1;
      if (type === "location" && (["earth", "country", "city"].includes(s.type) || ["earth", "country", "city"].includes(t.type))) return 1;
      return 0.05;
    });
}

// ======================== FOCUS ========================
function focusOn(target) {
  if (target === "terre") {
    expandedNodes.clear();
    expandedNodes.add("terre");
    render();
    updateBreadcrumb();
    return;
  }

  // Find the node
  const targetNode = allNodes.find(n => n.id === target || n.id.includes(target));
  if (!targetNode) return;

  // Expand path to this node
  expandedNodes.clear();
  expandedNodes.add("terre");

  let node = targetNode;
  while (node && node.parentId) {
    expandedNodes.add(node.parentId);
    node = nodeMap[node.parentId];
  }

  render();
  updateBreadcrumb();

  // Center view on this node
  setTimeout(() => {
    const p = computeRadialLayout().positions[targetNode.id];
    if (p) {
      svg.transition().duration(800).call(
        zoom.transform,
        d3.zoomIdentity.translate(width/2 - p.x * 1.5, height/2 - p.y * 1.5).scale(1.5)
      );
    }
  }, 100);
}

function resetFocus() {
  expandedNodes.clear();
  expandedNodes.add("terre");
  render();
  updateBreadcrumb();
  svg.transition().duration(800).call(
    zoom.transform,
    d3.zoomIdentity.translate(width/2, height/2).scale(0.9)
  );
}

// ======================== SEARCH ========================
function handleSearch() {
  const query = document.getElementById("searchInput").value.toLowerCase();
  if (!query) {
    d3.selectAll(".node").transition().duration(300).style("opacity", 1);
    d3.selectAll(".link").transition().duration(300).style("opacity", 1);
    return;
  }

  const matched = allNodes.filter(n => 
    (n.label && n.label.toLowerCase().includes(query)) || 
    n.id.toLowerCase().includes(query)
  );

  // Expand to show matched nodes
  matched.forEach(n => {
    let parent = nodeMap[n.parentId];
    while (parent) {
      expandedNodes.add(parent.id);
      parent = nodeMap[parent.parentId];
    }
  });

  render();
  updateBreadcrumb();

  setTimeout(() => {
    d3.selectAll(".node").style("opacity", d => {
      const isMatch = (d.label && d.label.toLowerCase().includes(query)) || d.id.toLowerCase().includes(query);
      return isMatch ? 1 : 0.15;
    });
  }, 100);
}

function findPath() {
  if (!selectedNode) {
    document.getElementById("ai").innerText = "Sélectionnez un nœud pour trouver un chemin.";
    return;
  }

  const path = getHierarchyPath(selectedNode.id);
  const pathStr = path.map(p => p.label || p.id).join(" → ");

  document.getElementById("ai").innerText = `Chemin hiérarchique : ${pathStr}`;

  // Highlight path
  const pathIds = new Set(path.map(p => p.id));
  d3.selectAll(".link").style("stroke", l => {
    return (pathIds.has(l.source) && pathIds.has(l.target)) ? "#7ab0ff" : "rgba(255,255,255,0.12)";

    return (pathIds.has(l.source) && pathIds.has(l.target)) ? "3px" : "1.5px";
